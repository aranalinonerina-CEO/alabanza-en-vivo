<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
let user = null;
</script>

<style>
body{background:#000;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#111;padding:20px;border-radius:16px;width:100%;max-width:420px}
input,textarea,button{width:100%;padding:10px;margin-top:8px;border-radius:10px;border:none}
button{cursor:pointer}
.primary{background:#22c55e;color:#000}
.secondary{background:#3b82f6;color:#fff}
.danger{background:#ef4444;color:#fff}
.small{background:#333;color:#fff}
.song{background:#222;padding:10px;border-radius:10px;margin-top:6px}
pre{white-space:pre-wrap}

/* 🎸 ACORDES */
.chord{color:#22c55e;font-weight:bold}
</style>
</head>

<body>
<div class="box" id="app"></div>

<script>
/* ---------- LOGIN SIMPLE ---------- */
const saved = localStorage.getItem("user");
saved ? (user=JSON.parse(saved), user.role==="leader"?leader():musician()) : login();

function login(){
  app().innerHTML=`
  <h2>Entrar</h2>
  <input id="u" placeholder="Usuario">
  <input id="r" placeholder="Código líder">
  <button class="primary" onclick="doLogin()">Entrar</button>
  <button class="small" onclick="register()">Registrarse</button>`;
}

function doLogin(){
  db.ref("users/"+val("u")).once("value").then(s=>{
    if(!s.exists()) return alert("No existe");
    if(s.val().room!==val("r")) return alert("Código incorrecto");
    user=s.val();
    localStorage.setItem("user",JSON.stringify(user));
    user.role==="leader"?leader():musician();
  });
}

/* ---------- REGISTRO ---------- */
function register(){
  app().innerHTML=`
  <h2>Registro</h2>
  <input id="u" placeholder="Usuario único">
  <select id="role">
    <option value="leader">Líder</option>
    <option value="musician">Músico</option>
    <option value="editor">Editor</option>
  </select>
  <input id="r" placeholder="Código líder">
  <button class="secondary" onclick="doRegister()">Crear</button>
  <button class="small" onclick="login()">Volver</button>`;
}

function doRegister(){
  const data={username:val("u"),role:val("role"),room:val("r")};
  db.ref("users/"+data.username).once("value").then(s=>{
    if(s.exists()) return alert("Usuario existe");
    if(data.role==="leader") db.ref("rooms/"+data.room).set({owner:data.username});
    db.ref("users/"+data.username).set(data);
    localStorage.setItem("user",JSON.stringify(data));
    user=data;
    user.role==="leader"?leader():musician();
  });
}

/* ---------- LÍDER ---------- */
function leader(){
  app().innerHTML=`
  <h2>Líder (${user.room})</h2>
  <input id="search" placeholder="Buscar alabanza" oninput="loadSongs()">
  <button class="primary" onclick="newSong()">➕ Nueva</button>
  <button class="small" onclick="logout()">Salir</button>
  <div id="list"></div>`;
  loadSongs();
}

function newSong(){
  app().innerHTML=`
  <h3>Nueva alabanza</h3>
  <input id="t" placeholder="Título">
  <textarea id="c" rows="6" placeholder="Letra + acordes [C]"></textarea>
  <input type="file" id="file">
  <button class="primary" onclick="saveSong()">Guardar</button>
  <button class="small" onclick="leader()">Volver</button>`;
}

function saveSong(){
  const ref=db.ref(`rooms/${user.room}/songs`).push({
    title:val("t"),content:val("c")
  });

  const f=document.getElementById("file").files[0];
  if(f){
    storage.ref(`${user.room}/${ref.key}/${f.name}`).put(f);
  }
  leader();
}

function loadSongs(){
  const q=val("search").toLowerCase();
  db.ref(`rooms/${user.room}/songs`).on("value",snap=>{
    list().innerHTML="";
    snap.forEach(c=>{
      if(!c.val().title.toLowerCase().includes(q)) return;
      list().innerHTML+=`
      <div class="song">
        <b onclick="send('${c.key}')">${c.val().title}</b>
        <button class="danger" onclick="del('${c.key}')">✖</button>
      </div>`;
    });
  });
}

function send(id){
  db.ref(`rooms/${user.room}/songs/${id}`).once("value").then(s=>{
    db.ref(`rooms/${user.room}/live`).set(s.val());
    db.ref(`rooms/${user.room}/history`).push(s.val());
  });
}

function del(id){
  if(confirm("Eliminar?"))
    db.ref(`rooms/${user.room}/songs/${id}`).remove();
}

/* ---------- MÚSICO ---------- */
function musician(){
  app().innerHTML=`
  <h2 id="t">Esperando…</h2>
  <pre id="c"></pre>
  <button class="small" onclick="logout()">Salir</button>`;
  db.ref(`rooms/${user.room}/live`).on("value",s=>{
    if(!s.exists()) return;
    t().innerText=s.val().title;
    c().innerHTML=renderChords(s.val().content);
  });
}

/* ---------- ACORDES ---------- */
function renderChords(text){
  return text.replace(/\[(.*?)\]/g,'<span class="chord">$1</span>');
}

/* ---------- UTILS ---------- */
const app=()=>document.getElementById("app");
const val=id=>document.getElementById(id)?.value||"";
const list=()=>document.getElementById("list");
const t=()=>document.getElementById("t");
const c=()=>document.getElementById("c");
function logout(){localStorage.clear();location.reload();}
</script>
</body>
</html>
