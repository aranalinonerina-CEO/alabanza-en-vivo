<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// 👉 cambiá esta clave cuando quieras
const LEADER_PASSWORD = "alabanza123";
</script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  background: #111;
  padding: 24px;
  border-radius: 18px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  cursor: pointer;
}
input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
}
.leader { background: #22c55e; color: #000; }
.musician { background: #3b82f6; color: #fff; }
.delete { background: #ef4444; color: #fff; }
.item {
  background: #222;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
}
.song {
  white-space: pre-wrap;
  font-size: 20px;
  margin-top: 16px;
  text-align: left;
}
</style>
</head>

<body>

<div class="box" id="app">
  <h1>🎶 Alabanza en vivo</h1>
  <button class="leader" onclick="askLeader()">Soy Líder</button>
  <button class="musician" onclick="musician()">Soy Músico</button>
</div>

<script>
let currentSongId = null;

// ---------- LOGIN LÍDER ----------
function askLeader() {
  const pass = prompt("Contraseña de líder:");
  if (pass === LEADER_PASSWORD) leader();
  else alert("Contraseña incorrecta");
}

// ---------- LÍDER ----------
function leader() {
  document.getElementById("app").innerHTML = `
    <h2>Líder</h2>
    <button class="leader" onclick="add()">➕ Nueva alabanza</button>
    <input id="search" placeholder="Buscar alabanza" oninput="loadSongs()">
    <div id="list">Cargando...</div>
  `;
  loadSongs();
}

function add() {
  document.getElementById("app").innerHTML = `
    <h2>Nueva alabanza</h2>
    <input id="title" placeholder="Título">
    <textarea id="content" rows="8" placeholder="Letra + acordes"></textarea>
    <button class="leader" onclick="saveSong()">Guardar</button>
    <button onclick="leader()">⬅ Volver</button>
  `;
}

function saveSong() {
  const title = titleEl().value;
  const content = contentEl().value;
  if (!title || !content) return alert("Completá todo");

  database.ref("songs").push({ title, content });
  leader();
}

function loadSongs() {
  const list = document.getElementById("list");
  const search = document.getElementById("search")?.value.toLowerCase() || "";

  database.ref("songs").on("value", snap => {
    list.innerHTML = "";
    if (!snap.exists()) return list.innerHTML = "<p>No hay alabanzas</p>";

    snap.forEach(child => {
      const s = child.val();
      if (!s.title.toLowerCase().includes(search)) return;

      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <b>${s.title}</b><br>
        <button onclick="openEditor('${child.key}')">✏️ Editar / Enviar</button>
        <button class="delete" onclick="deleteSong('${child.key}')">🗑 Eliminar</button>
      `;
      list.appendChild(div);
    });
  });
}

// ---------- EDITOR EN VIVO ----------
function openEditor(id) {
  currentSongId = id;
  database.ref("songs/" + id).once("value").then(snap => {
    const s = snap.val();

    database.ref("song").set({ title: s.title, content: s.content });

    document.getElementById("app").innerHTML = `
      <h2>Editando en vivo</h2>
      <input id="editTitle" value="${s.title}">
      <textarea id="editContent" rows="10">${s.content}</textarea>
      <button class="leader" onclick="saveLive()">💾 Guardar cambios</button>
      <button onclick="leader()">⬅ Volver</button>
    `;
  });
}

function saveLive() {
  const title = document.getElementById("editTitle").value;
  const content = document.getElementById("editContent").value;

  database.ref("songs/" + currentSongId).update({ title, content });
  database.ref("song").update({ title, content });

  alert("Actualizado en vivo 🎶");
}

function deleteSong(id) {
  if (!confirm("¿Eliminar alabanza?")) return;
  database.ref("songs/" + id).remove();
}

// ---------- MÚSICO ----------
function musician() {
  document.getElementById("app").innerHTML = `
    <h2 id="mt">Esperando…</h2>
    <div class="song" id="mc">---</div>
    <button onclick="toggleFull()">🖥 Pantalla completa</button>
  `;

  database.ref("song").on("value", snap => {
    if (!snap.exists()) return;
    mt.innerText = snap.val().title;
    mc.innerText = snap.val().content;
  });
}

function toggleFull() {
  if (!document.fullscreenElement)
    document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

function titleEl(){return document.getElementById("title")}
function contentEl(){return document.getElementById("content")}
</script>

</body>
</html>
