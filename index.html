<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
</script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  background: #111;
  padding: 24px;
  border-radius: 18px;
  max-width: 480px;
  width: 100%;
}
button,input,textarea {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}
.leader { background:#22c55e;color:#000 }
.musician { background:#3b82f6;color:#fff }
.song { white-space:pre-wrap;font-size:18px }
.chord { color:#22c55e;font-weight:bold }
</style>
</head>

<body>

<div class="box" id="app">
  <h1>🎶 Alabanza en vivo</h1>
  <button class="leader" onclick="role('leader')">Soy Líder</button>
  <button class="musician" onclick="role('musician')">Soy Músico</button>
</div>

<script>
let ROOM = null;

/* ========== ROLES ========= */
function role(r){
  r === "leader" ? leaderAuth() : musicianJoin();
}

/* ========== MÚSICO ========= */
function musicianJoin(){
  app(`
    <h2>Músico</h2>
    <input id="code" placeholder="Código del líder">
    <button onclick="enter()">Entrar</button>
  `);
}

function enter(){
  const c = code.value.trim();
  db.ref("rooms/"+c).once("value").then(s=>{
    if(!s.exists()) return alert("Código inválido");
    ROOM = c;
    musicianView();
  });
}

/* ========== LÍDER ========= */
function leaderAuth(){
  app(`
    <h2>Líder</h2>
    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>
    <button onclick="register()">Crear cuenta</button>
  `);
}

function register(){
  const u=user.value,p=pass.value;
  const code=Math.random().toString(36).substr(2,6).toUpperCase();
  db.ref("leaders/"+u).once("value").then(s=>{
    if(s.exists()) return alert("Usuario existe");
    db.ref("leaders/"+u).set({password:p,room:code});
    db.ref("rooms/"+code).set({owner:u});
    ROOM=code; leaderPanel();
  });
}

function login(){
  const u=user.value,p=pass.value;
  db.ref("leaders/"+u).once("value").then(s=>{
    if(!s.exists()||s.val().password!==p) return alert("Error");
    ROOM=s.val().room; leaderPanel();
  });
}

/* ========== LÍDER PANEL ========= */
function leaderPanel(){
  app(`
    <h2>Líder (Código ${ROOM})</h2>
    <button onclick="newSong()">➕ Nueva alabanza</button>
    <input id="search" placeholder="Buscar" oninput="loadSongs()">
    <div id="list"></div>
  `);
  loadSongs();
}

function newSong(){
  app(`
    <h2>Nueva alabanza</h2>
    <input id="title" placeholder="Título">
    <textarea id="content" rows="8" placeholder="Letra + acordes (Ej: [C] Santo es)"></textarea>
    <input type="file" id="file">
    <button onclick="saveSong()">Guardar</button>
    <button onclick="leaderPanel()">Volver</button>
  `);
}

function saveSong(){
  const t=title.value,c=content.value,f=file.files[0];
  const ref=db.ref("rooms/"+ROOM+"/songs").push();
  ref.set({title:t,content:c,date:Date.now()});
  if(f){
    storage.ref("files/"+ref.key).put(f);
  }
  leaderPanel();
}

function loadSongs(){
  const list=document.getElementById("list");
  if(!list) return;
  const q=search.value.toLowerCase();
  db.ref("rooms/"+ROOM+"/songs").on("value",s=>{
    list.innerHTML="";
    s.forEach(c=>{
      const v=c.val();
      if(!v.title.toLowerCase().includes(q)) return;
      const d=document.createElement("div");
      d.innerHTML=`<b>${v.title}</b>`;
      d.onclick=()=>db.ref("rooms/"+ROOM+"/live").set(v);
      d.style.padding="10px";d.style.background="#222";
      d.style.marginTop="6px";d.style.borderRadius="10px";
      list.appendChild(d);
    });
  });
}

/* ========== MÚSICO VIEW ========= */
function musicianView(){
  app(`
    <h2 id="t">Esperando…</h2>
    <div class="song" id="c"></div>
  `);
  db.ref("rooms/"+ROOM+"/live").on("value",s=>{
    if(!s.exists()) return;
    t.innerText=s.val().title;
    c.innerHTML=highlight(s.val().content);
  });
}

/* ========== UTIL ========= */
function highlight(t){
  return t.replace(/\[(.*?)\]/g,'<span class="chord">$1</span>');
}
function app(html){ document.getElementById("app").innerHTML=html }
</script>

</body>
</html>
