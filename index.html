<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

let room = null;
let currentSongId = null;
</script>

<style>
body {
  background:#000; color:#fff; font-family:system-ui;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; margin:0;
}
.box {
  background:#111; padding:24px; border-radius:18px;
  max-width:420px; width:100%;
}
button,input,textarea {
  width:100%; padding:12px; margin-top:10px;
  border-radius:10px; border:none;
}
.leader { background:#22c55e; color:#000 }
.musician { background:#3b82f6; color:#fff }
.delete { background:#ef4444; color:#fff }
.item { background:#222; padding:10px; border-radius:10px; margin-top:8px }
.song { white-space:pre-wrap; margin-top:12px }
a { color:#60a5fa }
</style>
</head>

<body>

<div class="box" id="app">
  <h2>🎶 Alabanza en vivo</h2>
  <input id="name" placeholder="Tu nombre">
  <select id="role">
    <option value="leader">Líder</option>
    <option value="musician">Músico</option>
  </select>
  <input id="room" placeholder="Código del líder (ej: ABC123)">
  <button onclick="enter()">Entrar</button>
</div>

<script>
function enter() {
  const name = nameEl().value;
  room = roomEl().value.toUpperCase();
  const role = roleEl().value;

  if (!name || !room) return alert("Completá todo");

  db.ref("rooms/"+room+"/users").push({ name, role });

  role === "leader" ? leader() : musician();
}

/* ---------- LÍDER ---------- */
function leader() {
  app().innerHTML = `
    <h2>Líder – Sala ${room}</h2>
    <button class="leader" onclick="add()">➕ Nueva alabanza</button>
    <div id="list"></div>
  `;
  loadSongs();
}

function add() {
  app().innerHTML = `
    <h3>Nueva alabanza</h3>
    <input id="title" placeholder="Título">
    <textarea id="content" rows="6" placeholder="Letra + acordes"></textarea>
    <input type="file" id="file">
    <button class="leader" onclick="saveSong()">Guardar</button>
    <button onclick="leader()">Volver</button>
  `;
}

function saveSong() {
  const title = titleEl().value;
  const content = contentEl().value;
  const file = document.getElementById("file").files[0];

  if (!title) return alert("Falta título");

  const ref = db.ref(`rooms/${room}/songs`).push();
  ref.set({ title, content });

  if (file) {
    storage.ref(`rooms/${room}/${ref.key}/${file.name}`)
      .put(file)
      .then(snap => snap.ref.getDownloadURL())
      .then(url => ref.update({ file:url }));
  }

  leader();
}

function loadSongs() {
  const list = document.getElementById("list");
  db.ref(`rooms/${room}/songs`).on("value", snap => {
    list.innerHTML = "";
    snap.forEach(c => {
      const s = c.val();
      list.innerHTML += `
        <div class="item">
          <b>${s.title}</b>
          <button onclick="edit('${c.key}')">✏️ Enviar / Editar</button>
          <button class="delete" onclick="del('${c.key}')">🗑</button>
        </div>`;
    });
  });
}

function edit(id) {
  currentSongId = id;
  db.ref(`rooms/${room}/songs/${id}`).once("value").then(s => {
    const d = s.val();
    db.ref(`rooms/${room}/live`).set(d);
    app().innerHTML = `
      <h3>Editando en vivo</h3>
      <input id="et" value="${d.title}">
      <textarea id="ec" rows="8">${d.content||""}</textarea>
      <button class="leader" onclick="saveLive()">Guardar</button>
      <button onclick="leader()">Volver</button>
    `;
  });
}

function saveLive() {
  const t = et().value;
  const c = ec().value;
  db.ref(`rooms/${room}/songs/${currentSongId}`).update({ title:t, content:c });
  db.ref(`rooms/${room}/live`).update({ title:t, content:c });
}

function del(id) {
  if (confirm("Eliminar alabanza?"))
    db.ref(`rooms/${room}/songs/${id}`).remove();
}

/* ---------- MÚSICO ---------- */
function musician() {
  app().innerHTML = `
    <h2 id="mt">Esperando…</h2>
    <div class="song" id="mc"></div>
    <div id="mf"></div>
  `;

  db.ref(`rooms/${room}/live`).on("value", s => {
    if (!s.exists()) return;
    const d = s.val();
    mt().innerText = d.title;
    mc().innerText = d.content || "";
    mf().innerHTML = d.file ? `<a href="${d.file}" target="_blank">📄 Ver partitura</a>` : "";
  });
}

/* helpers */
const app=()=>document.getElementById("app");
const nameEl=()=>document.getElementById("name");
const roomEl=()=>document.getElementById("room");
const roleEl=()=>document.getElementById("role");
const titleEl=()=>document.getElementById("title");
const contentEl=()=>document.getElementById("content");
const et=()=>document.getElementById("et");
const ec=()=>document.getElementById("ec");
const mt=()=>document.getElementById("mt");
const mc=()=>document.getElementById("mc");
const mf=()=>document.getElementById("mf");
</script>

</body>
</html>
