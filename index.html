<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
</script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  background: #111;
  padding: 24px;
  border-radius: 18px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  cursor: pointer;
}
.leader { background: #22c55e; color: #000; }
.musician { background: #3b82f6; color: #fff; }
.song { white-space: pre-wrap; margin-top: 16px; text-align: left; }
.item {
  background: #222;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="box" id="app">
  <h1>🎶 Alabanza en vivo</h1>
  <button class="leader" onclick="leader()">Soy Líder</button>
  <button class="musician" onclick="musician()">Soy Músico</button>
</div>

<script>
// ---------- LÍDER ----------
function leader() {
  document.getElementById("app").innerHTML = `
    <h2>Líder</h2>
    <button class="leader" onclick="add()">➕ Nueva alabanza</button>
    <div id="list">Cargando...</div>
  `;
  loadSongs();
}

function add() {
  document.getElementById("app").innerHTML = `
    <h2>Nueva alabanza</h2>
    <input id="title" placeholder="Título"
      style="width:100%;padding:10px"><br><br>
    <textarea id="content" rows="8"
      placeholder="Letra + acordes"
      style="width:100%;padding:10px"></textarea>
    <button class="leader" onclick="saveSong()">Guardar</button>
    <button onclick="leader()">⬅ Volver</button>
  `;
}

function saveSong() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  if (!title || !content) return alert("Completá todo");

  database.ref("songs").push({ title, content });
  leader();
}

function loadSongs() {
  const list = document.getElementById("list");
  database.ref("songs").on("value", snap => {
    list.innerHTML = "";
    if (!snap.exists()) {
      list.innerHTML = "<p>No hay alabanzas</p>";
      return;
    }
    snap.forEach(child => {
      const song = child.val();
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `<b>${song.title}</b>`;
      div.onclick = () => openEditor(child.key, song);
      list.appendChild(div);
    });
  });
}

// ---------- EDITOR EN VIVO ----------
let currentSongId = null;

function openEditor(id, song) {
  currentSongId = id;

  database.ref("song").set({
    id,
    title: song.title,
    content: song.content
  });

  document.getElementById("app").innerHTML = `
    <h2>Editando en vivo</h2>

    <input id="editTitle"
      value="${song.title}"
      style="width:100%;padding:10px"><br><br>

    <textarea id="editContent" rows="10"
      style="width:100%;padding:10px">${song.content}</textarea>

    <button class="leader" onclick="saveLive()">💾 Guardar cambios</button>
    <button onclick="leader()">⬅ Volver</button>
  `;
}

function saveLive() {
  const title = document.getElementById("editTitle").value;
  const content = document.getElementById("editContent").value;

  if (!title || !content) return alert("No puede estar vacío");

  // actualiza canción guardada
  database.ref("songs/" + currentSongId).update({ title, content });

  // actualiza lo que ve el músico
  database.ref("song").update({ title, content });

  alert("Cambios enviados en vivo 🎶");
}

// ---------- MÚSICO ----------
function musician() {
  document.getElementById("app").innerHTML = `
    <h2 id="t">Esperando alabanza…</h2>
    <div class="song" id="c">---</div>
  `;

  database.ref("song").on("value", snap => {
    if (!snap.exists()) return;
    document.getElementById("t").innerText = snap.val().title;
    document.getElementById("c").innerText = snap.val().content;
  });
}
</script>

</body>
</html>
