<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box {
  background:#111;
  padding:24px;
  border-radius:16px;
  width:100%;
  max-width:420px;
}
input, textarea, button {
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}
button { cursor:pointer; }
.primary { background:#22c55e; color:#000; }
.secondary { background:#3b82f6; color:#fff; }
.song {
  background:#222;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}
.chord { color:#22c55e; font-weight:bold; }
pre { white-space:pre-wrap; }
</style>
</head>

<body>

<div class="box" id="app"></div>

<script>
/* ========= UTILIDADES ========= */
function app(){ return document.getElementById("app"); }
function v(id){ return document.getElementById(id)?.value || ""; }

/* ========= INICIO ========= */
start();

function start(){
  app().innerHTML = `
    <h2>🎶 Alabanza en vivo</h2>
    <button class="primary" onclick="login()">Entrar</button>
    <button class="secondary" onclick="register()">Registrarse</button>
  `;
}

/* ========= LOGIN ========= */
function login(){
  app().innerHTML = `
    <h3>Entrar</h3>
    <input id="user" placeholder="Usuario">
    <input id="code" placeholder="Código del líder">
    <button class="primary" onclick="doLogin()">Entrar</button>
    <button onclick="start()">Volver</button>
  `;
}

function doLogin(){
  const u = v("user");
  const c = v("code");
  if(!u || !c) return alert("Faltan datos");

  db.ref("users/"+u).once("value").then(s=>{
    if(!s.exists()) return alert("Usuario no existe");
    const data = s.val();
    if(data.room !== c) return alert("Código incorrecto");

    localStorage.setItem("user", JSON.stringify(data));
    data.role === "leader" ? leader(data) : musician(data);
  });
}

/* ========= REGISTRO ========= */
function register(){
  app().innerHTML = `
    <h3>Registro</h3>
    <input id="user" placeholder="Usuario único">
    <select id="role">
      <option value="leader">Líder</option>
      <option value="musician">Músico</option>
    </select>
    <input id="code" placeholder="Código del líder">
    <button class="secondary" onclick="doRegister()">Crear cuenta</button>
    <button onclick="start()">Volver</button>
  `;
}

function doRegister(){
  const u=v("user"), r=v("role"), c=v("code");
  if(!u || !c) return alert("Faltan datos");

  db.ref("users/"+u).once("value").then(s=>{
    if(s.exists()) return alert("Usuario ya existe");

    const data = { username:u, role:r, room:c };
    if(r==="leader") db.ref("rooms/"+c).set({ owner:u });

    db.ref("users/"+u).set(data);
    localStorage.setItem("user", JSON.stringify(data));
    r==="leader"?leader(data):musician(data);
  });
}

/* ========= LÍDER ========= */
function leader(user){
  app().innerHTML = `
    <h3>Líder (${user.room})</h3>
    <button class="primary" onclick="newSong('${user.room}')">➕ Nueva alabanza</button>
    <div id="list"></div>
  `;
  loadSongs(user.room);
}

function newSong(room){
  app().innerHTML = `
    <h3>Nueva alabanza</h3>
    <input id="title" placeholder="Título">
    <textarea id="content" rows="6" placeholder="Letra + acordes [C]"></textarea>
    <button class="primary" onclick="saveSong('${room}')">Guardar</button>
    <button onclick="leader({room:'${room}',role:'leader'})">Volver</button>
  `;
}

function saveSong(room){
  db.ref("rooms/"+room+"/songs").push({
    title:v("title"),
    content:v("content")
  });
  leader({room,role:"leader"});
}

function loadSongs(room){
  const list=document.getElementById("list");
  db.ref("rooms/"+room+"/songs").on("value",snap=>{
    list.innerHTML="";
    snap.forEach(c=>{
      list.innerHTML+=`
        <div class="song" onclick="sendSong('${room}','${c.key}')">
          ${c.val().title}
        </div>`;
    });
  });
}

function sendSong(room,id){
  db.ref("rooms/"+room+"/songs/"+id).once("value").then(s=>{
    db.ref("rooms/"+room+"/live").set(s.val());
  });
}

/* ========= MÚSICO ========= */
function musician(user){
  app().innerHTML = `
    <h3 id="t">Esperando…</h3>
    <pre id="c">---</pre>
  `;
  db.ref("rooms/"+user.room+"/live").on("value",s=>{
    if(!s.exists()) return;
    document.getElementById("t").innerText=s.val().title;
    document.getElementById("c").innerHTML =
      s.val().content.replace(/\[(.*?)\]/g,'<span class="chord">$1</span>');
  });
}
</script>

</body>
</html>
