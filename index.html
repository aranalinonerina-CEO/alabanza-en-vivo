<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let leaderCode = null;
</script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  background: #111;
  padding: 24px;
  border-radius: 18px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
button, input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
}
button { cursor: pointer; }
.leader { background: #22c55e; color: #000; }
.musician { background: #3b82f6; color: #fff; }
.song { white-space: pre-wrap; margin-top: 12px; background:#222; padding:12px; border-radius:12px; }
</style>
</head>

<body>
<div class="box" id="app"></div>

<script>
start();

function start() {
  document.getElementById("app").innerHTML = `
    <h1>🎶 Alabanza en vivo</h1>
    <button class="leader" onclick="leaderRegister()">Soy Líder</button>
    <button class="musician" onclick="musicianLogin()">Soy Músico</button>
  `;
}

/* ===== LÍDER ===== */

function leaderRegister() {
  document.getElementById("app").innerHTML = `
    <h2>Crear cuenta líder</h2>
    <input id="lname" placeholder="Nombre del líder">
    <button class="leader" onclick="createLeader()">Crear cuenta</button>
    <button onclick="start()">Volver</button>
  `;
}

function createLeader() {
  const name = document.getElementById("lname").value;
  if (!name) return alert("Ingresá un nombre");

  leaderCode = "L" + Math.random().toString(36).substring(2,8).toUpperCase();

  db.ref("leaders/" + leaderCode).set({
    name,
    created: Date.now()
  });

  leaderPanel();
}

function leaderPanel() {
  document.getElementById("app").innerHTML = `
    <h2>Líder</h2>
    <p><b>Código:</b> ${leaderCode}</p>
    <button class="leader" onclick="newSong()">➕ Nueva alabanza</button>
    <input id="search" placeholder="Buscar" oninput="loadSongs()">
    <div id="list"></div>
  `;
  loadSongs();
}

function newSong() {
  document.getElementById("app").innerHTML = `
    <h2>Nueva alabanza</h2>
    <input id="title" placeholder="Título">
    <textarea id="content" rows="8" placeholder="Letra + acordes"></textarea>
    <button class="leader" onclick="saveSong()">Guardar</button>
    <button onclick="leaderPanel()">Volver</button>
  `;
}

function saveSong() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  if (!title || !content) {
    alert("Completá todo");
    return;
  }

  db.ref("songs/" + leaderCode).push({
    title: title,
    content: content,
    created: Date.now()
  });

  leaderPanel();
}

function loadSongs() {
  const list = document.getElementById("list");
  if (!list) return;
  const q = document.getElementById("search").value.toLowerCase();

  db.ref("songs/" + leaderCode).on("value", snap => {
    list.innerHTML = "";
    snap.forEach(c => {
      const s = c.val();
      if (!s.title.toLowerCase().includes(q)) return;

      const d = document.createElement("div");
      d.className = "song";
      d.innerHTML = `
        <b>${s.title}</b><br><br>
        <button onclick="sendSong('${c.key}')">Enviar</button>
        <button onclick="deleteSong('${c.key}')">Eliminar</button>
      `;
      list.appendChild(d);
    });
  });
}

function sendSong(id) {
  db.ref("songs/" + leaderCode + "/" + id).once("value")
    .then(s => db.ref("live/" + leaderCode).set(s.val()));
}

function deleteSong(id) {
  if (confirm("Eliminar alabanza?")) {
    db.ref("songs/" + leaderCode + "/" + id).remove();
  }
}

/* ===== MÚSICO ===== */

function musicianLogin() {
  document.getElementById("app").innerHTML = `
    <h2>Ingresar código</h2>
    <input id="code" placeholder="Código del líder">
    <button class="musician" onclick="enterAsMusician()">Entrar</button>
    <button onclick="start()">Volver</button>
  `;
}

function enterAsMusician() {
  const code = document.getElementById("code").value.toUpperCase();
  db.ref("leaders/" + code).once("value").then(snap => {
    if (!snap.exists()) return alert("Código inválido");
    leaderCode = code;
    musicianPanel();
  });
}

function musicianPanel() {
  document.getElementById("app").innerHTML = `
    <h2 id="t">Esperando alabanza…</h2>
    <div id="c" class="song"></div>
  `;

  db.ref("live/" + leaderCode).on("value", snap => {
    if (!snap.exists()) return;
    t.innerText = snap.val().title;
    c.innerText = snap.val().content;
  });
}
</script>
</body>
</html>
