<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alabanza en vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      max-width: 420px;
      width: 100%;
      padding: 24px;
      background: #111;
      border-radius: 18px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
    }
    .leader { background: #22c55e; color: #000; }
    .musician { background: #3b82f6; color: #fff; }
    .song {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="box" id="app">
  <h1>🎶 Alabanza en vivo</h1>
  <p>Elegí tu rol</p>
  <button class="leader" onclick="leader()">Soy Líder</button>
  <button class="musician" onclick="musician()">Soy Músico</button>
</div>

<script>
  function leader() {
    document.getElementById("app").innerHTML = `
      <h2>Líder</h2>
      <p>Enviar alabanza</p>
      <button onclick="send('Santo es el Señor')">Santo es el Señor</button>
      <button onclick="send('Cuán Grande es Él')">Cuán Grande es Él</button>
    `;
  }

  function musician() {
    document.getElementById("app").innerHTML = `
      <h2>Músico</h2>
      <div class="song" id="song">Esperando alabanza…</div>
    `;
    setInterval(() => {
      document.getElementById("song").innerText =
        localStorage.getItem("song") || "Esperando alabanza…";
    }, 500);
  }

  function send(song) {
    localStorage.setItem("song", song);
  }
</script>

</body>
</html>
