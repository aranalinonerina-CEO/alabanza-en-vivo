<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

let leaderCode = null;
let currentSongId = null;
</script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  background: #111;
  padding: 24px;
  border-radius: 18px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  cursor: pointer;
}
.leader { background: #22c55e; color: #000; }
.musician { background: #3b82f6; color: #fff; }
.song { white-space: pre-wrap; margin-top: 16px; text-align:left; }
.card {
  background:#222;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="box" id="app">
  <h1>🎶 Alabanza en vivo</h1>
  <button class="leader" onclick="leader()">Soy Líder</button>
  <button class="musician" onclick="musician()">Soy Músico</button>
</div>

<script>
/* ---------- LÍDER ---------- */

function leader() {
  document.getElementById("app").innerHTML = `
    <h2>Líder</h2>
    <button class="leader" onclick="showLoginLeader()">🔐 Entrar a mi cuenta</button>
    <button onclick="createLeader()">🆕 Crear cuenta nueva</button>
    <button onclick="location.reload()">⬅ Volver</button>
  `;
}

function showLoginLeader() {
  document.getElementById("app").innerHTML = `
    <h2>Entrar</h2>
    <input id="code" placeholder="Código de líder" style="width:100%;padding:10px"><br><br>
    <button class="leader" onclick="loginLeader()">Entrar</button>
    <button onclick="leader()">⬅ Volver</button>
  `;
}

function loginLeader() {
  const code = document.getElementById("code").value.toUpperCase();
  if (!code) return alert("Ingresá el código");

  db.ref("leaders/" + code).once("value").then(snap => {
    if (!snap.exists()) return alert("Código inválido");
    leaderCode = code;
    openLeaderPanel();
  });
}

function createLeader() {
  leaderCode = Math.random().toString(36).substring(2, 8).toUpperCase();

  db.ref("leaders/" + leaderCode).set({ created: Date.now() });
  alert("Tu código es: " + leaderCode);
  openLeaderPanel();
}

function openLeaderPanel() {
  document.getElementById("app").innerHTML = `
    <h2>Líder</h2>
    <p>Código: <b>${leaderCode}</b></p>
    <button class="leader" onclick="newSong()">➕ Nueva alabanza</button>
    <div id="list"></div>
    <button onclick="leader()">Cerrar sesión</button>
  `;
  loadSongs();
}

function newSong() {
  currentSongId = null;
  document.getElementById("app").innerHTML = `
    <h2>Nueva alabanza</h2>

    <input id="title" placeholder="Título"
      style="width:100%;padding:10px"><br><br>

    <textarea id="content" rows="8"
      placeholder="Letra + acordes"
      style="width:100%;padding:10px"></textarea>

    <br><br>

    <input type="file" id="file"
      accept=".pdf,.doc,.docx,image/*">

    <p style="font-size:12px;color:#aaa">
      PDF, Word o imágenes de partituras
    </p>

    <button class="leader" onclick="saveSong()">Guardar</button>
    <button onclick="openLeaderPanel()">Volver</button>
  `;
}

function saveSong() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  const file = document.getElementById("file")?.files[0];

  if (!title || !content) {
    alert("Completá título y letra");
    return;
  }

  const songRef = currentSongId
    ? db.ref(`songs/${leaderCode}/${currentSongId}`)
    : db.ref(`songs/${leaderCode}`).push();

  const songId = songRef.key;

  if (file) {
    const storageRef = storage.ref(
      `files/${leaderCode}/${songId}/${file.name}`
    );

    storageRef.put(file).then(snapshot => {
      snapshot.ref.getDownloadURL().then(url => {
        songRef.set({
          title,
          content,
          fileUrl: url,
          fileName: file.name
        });
        openLeaderPanel();
      });
    });
  } else {
    songRef.set({ title, content });
    openLeaderPanel();
  }
}

function editSong(id) {
  db.ref(`songs/${leaderCode}/${id}`).once("value").then(snap => {
    const s = snap.val();
    currentSongId = id;
    document.getElementById("app").innerHTML = `
      <h2>Editando</h2>
      <input id="title" value="${s.title}" style="width:100%;padding:10px"><br><br>
      <textarea id="content" rows="10"
        style="width:100%;padding:10px">${s.content}</textarea>
      <button class="leader" onclick="saveSong()">Guardar</button>
      <button onclick="openLeaderPanel()">Volver</button>
    `;
  });
}

function deleteSong(id) {
  if (confirm("¿Eliminar?"))
    db.ref(`songs/${leaderCode}/${id}`).remove();
}

function sendSong(id) {
  db.ref(`songs/${leaderCode}/${id}`).once("value").then(snap => {
    db.ref(`live/${leaderCode}`).set(snap.val());
    alert("Enviada");
  });
}

/* ---------- MÚSICO ---------- */

function musician() {
  document.getElementById("app").innerHTML = `
    <h2>Músico</h2>
    <input id="code" placeholder="Código del líder"
      style="width:100%;padding:10px"><br><br>
    <button class="musician" onclick="enterMusician()">Entrar</button>
  `;
}

function enterMusician() {
  const code = document.getElementById("code").value.toUpperCase();
  if (!code) return;

  db.ref("leaders/" + code).once("value").then(snap => {
    if (!snap.exists()) return alert("Código inválido");
    listenLive(code);
  });
}

function listenLive(code) {
  document.getElementById("app").innerHTML = `
    <h2 id="t">Esperando…</h2>
    <div class="song" id="c">---</div>
  `;

  db.ref(`live/${code}`).on("value", snap => {
    if (!snap.exists()) return;
    document.getElementById("t").innerText = snap.val().title;
    document.getElementById("c").innerText = snap.val().content;
  });
}
</script>

</body>
</html>
