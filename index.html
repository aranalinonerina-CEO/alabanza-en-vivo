<!DOCTYPE html>
<html lang="es">
  <head>
  <meta charset="UTF-8">
  <title>Alabanza en vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 🔥 FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
  const firebaseConfig = {
    apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
    authDomain: "alabanza-en-vivo.firebaseapp.com",
    databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
    projectId: "alabanza-en-vivo",
    storageBucket: "alabanza-en-vivo.appspot.com",
    messagingSenderId: "374349060844",
    appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
</script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      max-width: 420px;
      width: 100%;
      padding: 24px;
      background: #111;
      border-radius: 18px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
    }
    .leader { background: #22c55e; color: #000; }
    .musician { background: #3b82f6; color: #fff; }
    .song {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="box" id="app">
  <h1>🎶 Alabanza en vivo</h1>
  <p>Elegí tu rol</p>
  <button class="leader" onclick="leader()">Soy Líder</button>
  <button class="musician" onclick="musician()">Soy Músico</button>
</div>

<script>
  function leader() {
    document.getElementById("app").innerHTML = `
      <h2>Líder</h2>

      <input id="search" placeholder="Buscar alabanza"
        style="width:100%;padding:10px;border-radius:10px;margin-bottom:10px"
        oninput="loadSongs()">

      <div id="songList">Cargando...</div>
    `;

    loadSongs();
  }

  function loadSongs() {
    const search = document.getElementById("search")?.value?.toLowerCase() || "";

    database.ref("songs").once("value", snapshot => {
      const songs = snapshot.val() || {};
      let html = "";

      Object.keys(songs).forEach(id => {
        const song = songs[id];
        if (!song.title.toLowerCase().includes(search)) return;

        html += `
          <div style="margin-bottom:10px;padding:10px;background:#222;border-radius:10px">
            <strong>${song.title}</strong>
            <button class="leader" onclick="sendSong('${id}')">Enviar</button>
          </div>
        `;
      });

      document.getElementById("songList").innerHTML =
        html || "<p>No hay resultados</p>";
    });
  }

  function sendSong(id) {
    database.ref("songs/" + id).once("value", snapshot => {
      database.ref("currentSong").set(snapshot.val());
    });
  }

  function musician() {
    document.getElementById("app").innerHTML = `
      <h2 id="songTitle">Esperando…</h2>
      <pre class="song" id="songContent">Esperando alabanza…</pre>
    `;

    database.ref("currentSong").on("value", snapshot => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById("songTitle").innerText = data.title;
      document.getElementById("songContent").innerText = data.content;
    });
  }
</script>

</body>
</html>
