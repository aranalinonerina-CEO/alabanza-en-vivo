<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alabanza en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box {
  background:#111;
  padding:24px;
  border-radius:18px;
  width:100%;
  max-width:420px;
  text-align:center;
}
button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
}
.leader { background:#22c55e; color:#000; }
.musician { background:#3b82f6; color:#fff; }
.card {
  background:#222;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}
.song {
  white-space:pre-wrap;
  text-align:left;
  margin-top:16px;
}
a { color:#60a5fa; }
input, textarea {
  border-radius:10px;
  border:none;
  outline:none;
}
</style>
</head>

<body>

<div class="box" id="app">
  <h1>🎶 Alabanza en vivo</h1>
  <button class="leader" onclick="showLeader()">Soy Líder</button>
  <button class="musician" onclick="showMusician()">Soy Músico</button>
</div>

<script>
/* ================== FIREBASE ================== */

const firebaseConfig = {
  apiKey: "AIzaSyAXKadX2tmURGRO3oZJ2iNJVpUoqzD5jSk",
  authDomain: "alabanza-en-vivo.firebaseapp.com",
  databaseURL: "https://alabanza-en-vivo-default-rtdb.firebaseio.com",
  projectId: "alabanza-en-vivo",
  storageBucket: "alabanza-en-vivo.appspot.com",
  messagingSenderId: "374349060844",
  appId: "1:374349060844:web:67860d311a8ced5db7e3c9"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();
const auth = firebase.auth();

auth.signInAnonymously().catch(err => {
  alert("Error de autenticación: " + err.message);
});

let leaderCode = null;
let currentSongId = null;

/* ================== PANTALLAS ================== */

function showLeader() {
  const savedLeader = localStorage.getItem("leaderCode");

  if (savedLeader) {
    db.ref("leaders/" + savedLeader).once("value").then(snap => {
      if (snap.exists() && confirm("¿Entrar con tu cuenta guardada?")) {
        leaderCode = savedLeader;
        openLeaderPanel();
      }
    });
  }

  document.getElementById("app").innerHTML = `
    <h2>Líder</h2>
    <button class="leader" onclick="loginLeader()">Entrar con código</button>
    <button onclick="createLeader()">Crear cuenta</button>
    <button onclick="location.reload()">Volver</button>
  `;
}

function showMusician() {
  document.getElementById("app").innerHTML = `
    <h2>Músico</h2>
    <input id="code" placeholder="Código del líder"
      style="width:100%;padding:10px"><br><br>
    <button class="musician" onclick="enterMusician()">Entrar</button>
    <button onclick="location.reload()">Volver</button>
  `;
}

/* ================== LÍDER ================== */

function createLeader() {
  leaderCode = Math.random().toString(36).substring(2,8).toUpperCase();
  db.ref("leaders/" + leaderCode).set({ created: Date.now() }).then(() => {
    localStorage.setItem("leaderCode", leaderCode);
    alert("Tu código es: " + leaderCode);
    openLeaderPanel();
  });
}

function loginLeader() {
  const code = prompt("Ingresá tu código").toUpperCase();
  if (!code) return;

  db.ref("leaders/" + code).once("value").then(snap => {
    if (!snap.exists()) return alert("Código inválido");
    leaderCode = code;
    localStorage.setItem("leaderCode", leaderCode);
    openLeaderPanel();
  });
}

function openLeaderPanel() {
  document.getElementById("app").innerHTML = `
    <h2>Líder</h2>
    <p>Código: <b>${leaderCode}</b></p>
    <button class="leader" onclick="newSong()">Nueva alabanza</button>
    <div id="list"></div>
    <button onclick="location.reload()">Cerrar sesión</button>
  `;
  loadSongs();
}

function newSong() {
  currentSongId = null;
  document.getElementById("app").innerHTML = `
    <h2>Nueva alabanza</h2>
    <input id="title" placeholder="Título"
      style="width:100%;padding:10px"><br><br>
    <textarea id="content" rows="6"
      placeholder="Letra / acordes"
      style="width:100%;padding:10px"></textarea><br><br>
    <input type="file" id="file" accept=".pdf,.doc,.docx,image/*"><br><br>
    <button class="leader" onclick="saveSong()">Guardar</button>
    <button onclick="openLeaderPanel()">Volver</button>
  `;
}

async function saveSong() {
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const fileInput = document.getElementById("file");
  const file = fileInput.files[0];

  if (!title) return alert("El título es obligatorio");
  if (!content && !file) return alert("Agregá letra o archivo");

  const ref = currentSongId
    ? db.ref(`songs/${leaderCode}/${currentSongId}`)
    : db.ref(`songs/${leaderCode}`).push();

  let fileData = {};

  if (file) {
    const storageRef = storage.ref(`files/${leaderCode}/${ref.key}/${file.name}`);
    const snap = await storageRef.put(file);
    const url = await snap.ref.getDownloadURL();
    fileData = { fileUrl: url, fileName: file.name };
  }

  await ref.set({ title, content, ...fileData, created: Date.now() });
  alert("Guardado correctamente");
  openLeaderPanel();
}

function loadSongs() {
  const list = document.getElementById("list");
  db.ref(`songs/${leaderCode}`).on("value", snap => {
    list.innerHTML = "";
    snap.forEach(c => {
      const s = c.val();
      list.innerHTML += `
        <div class="card">
          <b>${s.title}</b><br>
          <button onclick="sendSong('${c.key}')">Enviar</button>
          <button onclick="editSong('${c.key}')">Editar</button>
          <button onclick="deleteSong('${c.key}')">Eliminar</button>
        </div>`;
    });
  });
}

function editSong(id) {
  db.ref(`songs/${leaderCode}/${id}`).once("value").then(snap => {
    const s = snap.val();
    currentSongId = id;
    document.getElementById("app").innerHTML = `
      <h2>Editar</h2>
      <input id="title" value="${s.title}"
        style="width:100%;padding:10px"><br><br>
      <textarea id="content" rows="6"
        style="width:100%;padding:10px">${s.content || ""}</textarea><br><br>
      <input type="file" id="file"><br><br>
      ${s.fileUrl ? `<a href="${s.fileUrl}" target="_blank">Archivo actual</a><br><br>` : ""}
      <button class="leader" onclick="saveSong()">Guardar</button>
      <button onclick="openLeaderPanel()">Cancelar</button>
    `;
  });
}

function deleteSong(id) {
  if (confirm("¿Eliminar alabanza?"))
    db.ref(`songs/${leaderCode}/${id}`).remove();
}

function sendSong(id) {
  db.ref(`songs/${leaderCode}/${id}`).once("value").then(snap => {
    db.ref(`live/${leaderCode}`).set(snap.val());
    alert("Enviada a músicos");
  });
}

/* ================== MÚSICO ================== */

function enterMusician() {
  const code = document.getElementById("code").value.toUpperCase();
  if (!code) return;
  db.ref("leaders/" + code).once("value").then(snap => {
    if (!snap.exists()) return alert("Código inválido");
    listenLive(code);
  });
}

function listenLive(code) {
  document.getElementById("app").innerHTML = `
    <h2 id="t">Esperando…</h2>
    <div class="song" id="c"></div>
    <div id="f"></div>
  `;
  db.ref(`live/${code}`).on("value", snap => {
    if (!snap.exists()) return;
    const s = snap.val();
    document.getElementById("t").innerText = s.title || "";
    document.getElementById("c").innerText = s.content || "";
    document.getElementById("f").innerHTML =
      s.fileUrl ? `<a href="${s.fileUrl}" target="_blank">Ver archivo</a>` : "";
  });
}
</script>

</body>
</html>
